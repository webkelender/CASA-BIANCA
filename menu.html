  body { min-height: 100%; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(44,26,16,0.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .logo-label { font-size: 9px; letter-spacing: .25em; color: var(--amber); text-transform: uppercase; margin-bottom: 2px; }
  .logo-name { font-size: 18px; font-weight: 400; color: var(--cream); }
  .cart-btn {
    background: var(--amber); color: #1A0F0A; border: none; border-radius: 22px;
    padding: 9px 18px; cursor: pointer; font-weight: 700; font-size: 13px;
    font-family: inherit; display: flex; align-items: center; gap: 7px;
    transition: background .2s; display: none;
  }
  .cart-btn:hover { background: var(--amber-light); }
  .cart-btn.visible { display: flex; }

  /* TABS */
  .tabs { background: rgba(44,26,16,0.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 13px 18px; cursor: pointer;
    font-family: inherit; font-size: 13px; white-space: nowrap; transition: all .2s;
  }
  .tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); font-weight: 700; }
  .tab-btn:hover:not(.active) { color: var(--cream); }

  /* HERO BANNER */
  .category-hero {
    height: 120px; position: relative; overflow: hidden; display: none;
  }
  .category-hero.visible { display: block; }
  .category-hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.45); }
  .category-hero-info {
    position: absolute; inset: 0; display: flex; align-items: center; padding: 0 20px;
    background: linear-gradient(90deg, rgba(26,15,10,.85) 0%, transparent 70%);
  }
  .category-hero-emoji { font-size: 26px; margin-bottom: 4px; }
  .category-hero-name { font-size: 22px; font-weight: 700; color: var(--cream); }
  .category-hero-count { font-size: 12px; color: var(--muted); }

  /* MENU ITEMS */
  .items-grid { padding: 14px 16px 120px; max-width: 680px; margin: 0 auto; }
  .item-card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border); margin-bottom: 14px;
    transition: border-color .25s, box-shadow .25s;
  }
  .item-card.in-cart { border-color: rgba(232,168,80,.55); box-shadow: 0 4px 20px rgba(232,168,80,.12); }
  .item-img-wrap { position: relative; height: 150px; background: #2a1408; overflow: hidden; }
  .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .45s; }
  .item-img-wrap img.loaded { opacity: 1; }
  .item-img-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 44px; background: linear-gradient(135deg,#2a1408,#3d2010);
  }
  .img-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(to top, var(--card), transparent); pointer-events: none; }
  .prep-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
    border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--cream);
  }
  .cart-badge {
    position: absolute; top: 10px; left: 10px;
    background: var(--amber); color: #1A0F0A;
    border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; display: none;
  }
  .cart-badge.show { display: block; }
  .item-body { padding: 12px 14px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .item-info { flex: 1; }
  .item-name { font-weight: 700; font-size: 14px; color: var(--cream); margin-bottom: 4px; }
  .item-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .item-price { color: var(--amber); font-weight: 700; font-size: 15px; }
  .add-btn {
    background: var(--amber); color: #1A0F0A; border: none; border-radius: 9px;
    padding: 7px 18px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: inherit;
    transition: background .15s;
  }
  .add-btn:hover { background: var(--amber-light); }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    background: transparent; border: 1px solid rgba(232,168,80,.35);
    color: var(--amber); width: 28px; height: 28px; border-radius: 7px;
    cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .qty-btn:hover { background: rgba(232,168,80,.12); }
  .qty-num { font-weight: 700; font-size: 14px; min-width: 16px; text-align: center; }

  /* CART DRAWER */
  .cart-drawer {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  }
  .cart-drawer.open { display: block; }
  .cart-panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 100%; max-width: 420px;
    background: var(--dark); display: flex; flex-direction: column;
    border-left: 1px solid var(--border);
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .cart-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .cart-title { font-size: 18px; font-weight: 400; }
  .close-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 20px; padding: 4px; line-height: 1;
  }
  .close-btn:hover { color: var(--cream); }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .cart-item-thumb {
    width: 52px; height: 52px; border-radius: 9px; overflow: hidden;
    background: var(--card); flex-shrink: 0;
  }
  .cart-item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .cart-item-unit { font-size: 11px; color: var(--muted); }
  .cart-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cart-item-total { color: var(--amber); font-weight: 700; font-size: 13px; min-width: 60px; text-align: right; }
  .cart-total-row {
    display: flex; justify-content: space-between; padding: 14px 20px;
    border-top: 2px solid rgba(232,168,80,.25); font-size: 17px; font-weight: 700;
    color: var(--amber); flex-shrink: 0;
  }
  .cart-footer { padding: 14px 20px 20px; flex-shrink: 0; border-top: 1px solid var(--border); }
  .field-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; display: block; }
  .field-input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 13px; color: var(--cream); font-family: inherit; font-size: 13px;
    outline: none; margin-bottom: 12px; transition: border-color .2s;
  }
  .field-input:focus { border-color: rgba(232,168,80,.5); }
  .place-btn {
    width: 100%; background: var(--amber); color: #1A0F0A; border: none; border-radius: 11px;
    padding: 14px; cursor: pointer; font-weight: 700; font-size: 15px; font-family: inherit;
    transition: background .2s;
  }
  .place-btn:hover { background: var(--amber-light); }
  .place-btn:disabled { background: var(--card); color: var(--muted); cursor: not-allowed; }

  /* SUCCESS SCREEN */
  #success-screen {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: var(--bg); flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  #success-screen.show { display: flex; }
  .success-icon { font-size: 64px; margin-bottom: 20px; animation: pop .4s ease; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title { font-size: 28px; font-weight: 400; margin-bottom: 8px; }
  .success-sub { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .success-note { font-size: 12px; color: var(--muted); margin-bottom: 32px; }
  .order-again-btn {
    background: var(--amber); color: #1A0F0A; border: none; border-radius: 11px;
    padding: 12px 28px; cursor: pointer; font-weight: 700; font-size: 14px;
    font-family: inherit; transition: background .2s;
  }
  .order-again-btn:hover { background: var(--amber-light); }

  /* STICKY FOOTER */
  .sticky-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(44,26,16,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 16px;
    display: none;
  }
  .sticky-footer.visible { display: block; }
  .sticky-footer-btn {
    width: 100%; max-width: 480px; margin: 0 auto; display: block;
    background: var(--amber); color: #1A0F0A; border: none; border-radius: 11px;
    padding: 14px; cursor: pointer; font-weight: 700; font-size: 14px;
    font-family: inherit; transition: background .2s;
  }
  .sticky-footer-btn:hover { background: var(--amber-light); }

  /* NOTIFICATION TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #fff; border-radius: 22px;
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


</style>
</head>
<body>

<header>
  <div>
    <div class="logo-label">Casa Bianca</div>
    <div class="logo-name">Our Menu</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="tableTag" style="display:none;background:rgba(232,168,80,0.12);border:1px solid rgba(232,168,80,0.3);color:#E8A850;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;"></div>
    <button class="cart-btn" id="cartBtn" onclick="openCart()">🛒 <span id="cartLabel">0 items</span></button>
  </div>
</header>

  <div style="font-size:56px;margin-bottom:20px;">🚫</div>
  <div style="font-size:22px;font-weight:700;color:#F5EDD8;margin-bottom:10px;">Invalid Access</div>
  <div style="font-size:14px;color:#B89070;margin-bottom:6px;">Please scan the QR code on your table</div>
  <div style="font-size:12px;color:#7a5535;margin-top:4px;">Direct URL access is not allowed</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="category-hero" id="heroWrap">
  <img id="heroImg" src="" alt="" />
  <div class="category-hero-info">
    <div>
      <div class="category-hero-emoji" id="heroEmoji"></div>
      <div class="category-hero-name" id="heroName"></div>
      <div class="category-hero-count" id="heroCount"></div>
    </div>
  </div>
</div>

<div class="items-grid" id="itemsGrid"></div>
<div class="sticky-footer" id="stickyFooter">
  <button class="sticky-footer-btn" onclick="openCart()">
    View Order — <span id="footerLabel"></span>
  </button>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cartDrawer" onclick="closeCartOutside(event)">
  <div class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Your Order</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">₹0</span></div>
    <div class="cart-footer">
      <label class="field-label">Your Table</label>
      <div id="tableDisplay" style="
        width:100%;background:rgba(232,168,80,0.08);border:1px solid rgba(232,168,80,0.25);
        border-radius:9px;padding:11px 13px;color:#E8A850;font-size:14px;font-weight:700;
        margin-bottom:12px;display:flex;align-items:center;gap:8px;
      ">🪑 <span id="tableDisplayNum"></span> <span style="margin-left:auto;font-size:10px;color:#B89070;font-weight:400;">Locked to this table</span></div>
      <label class="field-label">Special Instructions</label>
      <textarea class="field-input" id="noteInput" rows="2" placeholder="Allergies, preferences…" style="resize:none"></textarea>
      <button class="place-btn" id="placeBtn" onclick="placeOrder()">Place Order →</button>
    </div>
  </div>
</div>

<!-- Success -->
<div id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Order Placed!</div>
  <div class="success-sub" id="successOrderId"></div>
  <div class="success-note">Your food is being prepared. We'll bring it to your table.</div>
  <button class="order-again-btn" onclick="resetAndOrder()">Order More</button>
</div>

<div class="toast" id="toast"></div>

<script>
const MENU = [
  { category:"Starters", emoji:"🥗", items:[
    {id:"s1",name:"Bruschetta Trio",price:280,desc:"Tomato, olive tapenade & mushroom on toasted ciabatta",prep:8,q:"bruschetta"},
    {id:"s2",name:"Soup of the Day",price:220,desc:"Chef's seasonal selection, served with bread roll",prep:10,q:"tomato soup"},
    {id:"s3",name:"Crispy Calamari",price:340,desc:"Lightly battered, served with aioli & lemon",prep:12,q:"calamari"},
  ]},
  { category:"Mains", emoji:"🍽️", items:[
    {id:"m1",name:"Grilled Chicken",price:520,desc:"Free-range chicken, roasted veggies, rosemary jus",prep:18,q:"chicken"},
    {id:"m2",name:"Pasta Arrabbiata",price:380,desc:"Penne in spicy tomato sauce, fresh basil & parmesan",prep:15,q:"arrabiata"},
    {id:"m3",name:"Pan-Seared Salmon",price:680,desc:"Atlantic salmon, asparagus, lemon butter",prep:20,q:"salmon"},
    {id:"m4",name:"Mushroom Risotto",price:420,desc:"Arborio rice, wild mushrooms, truffle oil, parmesan",prep:22,q:"risotto"},
  ]},
  { category:"Pizzas", emoji:"🍕", items:[
    {id:"p1",name:"Margherita",price:360,desc:"San Marzano tomato, buffalo mozzarella, fresh basil",prep:14,q:"pizza margherita"},
    {id:"p2",name:"BBQ Chicken",price:440,desc:"Smoked chicken, red onion, BBQ drizzle, cheddar",prep:16,q:"pizza"},
    {id:"p3",name:"Truffle Funghi",price:490,desc:"Mixed mushrooms, truffle cream, parmesan shavings",prep:16,q:"mushroom"},
  ]},
  { category:"Desserts", emoji:"🍮", items:[
    {id:"d1",name:"Tiramisu",price:220,desc:"Classic Italian, ladyfingers, mascarpone, espresso",prep:5,q:"tiramisu"},
    {id:"d2",name:"Choco Lava Cake",price:260,desc:"Warm dark chocolate, vanilla bean ice cream",prep:12,q:"chocolate cake"},
    {id:"d3",name:"Panna Cotta",price:200,desc:"Vanilla cream, seasonal berry coulis",prep:5,q:"panna cotta"},
  ]},
  { category:"Drinks", emoji:"🥤", items:[
    {id:"dr1",name:"Fresh Lime Soda",price:120,desc:"Freshly squeezed lime, sparkling water, mint",prep:3,q:"lemonade"},
    {id:"dr2",name:"Mango Lassi",price:150,desc:"Alphonso mango, yogurt, cardamom",prep:4,q:"lassi"},
    {id:"dr3",name:"Filter Coffee",price:90,desc:"South Indian filter coffee with warm milk",prep:5,q:"coffee"},
    {id:"dr4",name:"House Wine",price:340,desc:"Red or white, ask your server for today's selection",prep:2,q:"wine"},
  ]},
];
const ALL_ITEMS = MENU.flatMap(c=>c.items);
const fmt = n=>`₹${Number(n).toLocaleString("en-IN")}`;
let cart = {};
let activeTab = "Starters";

// Curated Unsplash food images — proper aspect ratio, aesthetic, not zoomed
const ITEM_IMGS = {
  s1: "https://images.unsplash.com/photo-1506280754576-f6fa8a873550?w=600&q=80", // bruschetta
  s2: "https://images.unsplash.com/photo-1547592180-85f173990554?w=600&q=80", // tomato soup
  s3: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=600&q=80", // calamari
  m1: "https://images.unsplash.com/photo-1598103442097-8b74394b95c3?w=600&q=80", // grilled chicken
  m2: "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600&q=80", // pasta
  m3: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=600&q=80", // salmon
  m4: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=600&q=80", // risotto
  p1: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=600&q=80", // margherita
  p2: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&q=80", // bbq chicken pizza
  p3: "https://images.unsplash.com/photo-1548369937-47519962c11a?w=600&q=80", // mushroom pizza
  d1: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=600&q=80", // tiramisu
  d2: "https://images.unsplash.com/photo-1624353365286-3f8d62daad51?w=600&q=80", // choco lava
  d3: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&q=80", // panna cotta
  dr1:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=600&q=80", // lime soda
  dr2:"https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=600&q=80", // mango lassi
  dr3:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&q=80", // filter coffee
  dr4:"https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=600&q=80", // wine
};
// Per-item focus point so the most appetising part is always centred
const ITEM_POS = {
  s1:"center center", s2:"center center", s3:"center center",
  m1:"center 40%",   m2:"center center", m3:"center 35%",   m4:"center center",
  p1:"center center", p2:"center center", p3:"center center",
  d1:"center 40%",   d2:"center 55%",   d3:"center 40%",
  dr1:"center center",dr2:"center 30%",  dr3:"center 40%",  dr4:"center center",
};

function getImg(id) { return ITEM_IMGS[id] || null; }
const fallbackEmoji = id => {
  if(["p1","p2","p3"].includes(id)) return "🍕";
  if(["d1","d2","d3"].includes(id)) return "🍮";
  if(["dr1","dr2","dr3","dr4"].includes(id)) return "🥤";
  if(["m1","m2","m3","m4"].includes(id)) return "🍽️";
  return "🥗";
};

function buildTabs() {
  const tabs = document.getElementById("tabs");
  MENU.forEach(cat => {
    const b = document.createElement("button");
    b.className = "tab-btn" + (cat.category===activeTab?" active":"");
    b.textContent = cat.emoji+" "+cat.category;
    b.onclick = () => switchTab(cat.category);
    tabs.appendChild(b);
  });
}

function switchTab(cat) {
  activeTab = cat;
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active", MENU[i].category===cat));
  renderItems();
  updateHero();
}

function updateHero() {
  const cat = MENU.find(c=>c.category===activeTab);
  const wrap = document.getElementById("heroWrap");
  const img = document.getElementById("heroImg");
  document.getElementById("heroEmoji").textContent = cat.emoji;
  document.getElementById("heroName").textContent = cat.category;
  document.getElementById("heroCount").textContent = cat.items.length+" items";
  wrap.classList.add("visible");
  const firstItem = cat.items[0];
  const url = getImg(firstItem.id);
  if(url){
    img.style.objectPosition = ITEM_POS[firstItem.id] || "center center";
    img.src = url;
    img.onload = ()=>img.classList.add("loaded");
  } else {
    img.src = "";
  }
}

function renderItems() {
  const grid = document.getElementById("itemsGrid");
  grid.innerHTML = "";
  const cat = MENU.find(c=>c.category===activeTab);
  cat.items.forEach(item => {
    const qty = cart[item.id]||0;
    const url = getImg(item.id);
    const pos = ITEM_POS[item.id] || "center center";
    const card = document.createElement("div");
    card.className = "item-card"+(qty>0?" in-cart":"");
    card.id = "card-"+item.id;
    card.innerHTML = `
      <div class="item-img-wrap">
        <div class="item-img-fallback" id="fb-${item.id}">${fallbackEmoji(item.id)}</div>
        <img id="img-${item.id}" alt="${item.name}" style="object-position:${pos}" ${url?`src="${url}"`:""}/>
        <div class="img-fade"></div>
        <div class="prep-badge">⏱ ~${item.prep} min</div>
        <div class="cart-badge ${qty>0?"show":""}" id="badge-${item.id}">${qty} in cart ✓</div>
      </div>
      <div class="item-body">
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        <div class="item-right">
          <div class="item-price">${fmt(item.price)}</div>
          <div id="ctrl-${item.id}">${renderCtrl(item.id, qty)}</div>
        </div>
      </div>`;
    grid.appendChild(card);
    if(url) {
      const img = document.getElementById("img-"+item.id);
      img.onload = () => {
        img.classList.add("loaded");
        const fb = document.getElementById("fb-"+item.id);
        if(fb) fb.style.opacity = "0";
      };
      if(img.complete) img.onload();
    }
  });
}

function renderCtrl(id, qty) {
  if(qty===0) return `<button class="add-btn" onclick="addItem('${id}')">+ Add</button>`;
  return `<div class="qty-ctrl">
    <button class="qty-btn" onclick="remItem('${id}')">−</button>
    <span class="qty-num">${qty}</span>
    <button class="qty-btn" onclick="addItem('${id}')">+</button>
  </div>`;
}

function addItem(id) {
  cart[id] = (cart[id]||0)+1;
  refreshItem(id); updateCartUI();
}
function remItem(id) {
  if(!cart[id]) return;
  cart[id]--;
  if(cart[id]===0) delete cart[id];
  refreshItem(id); updateCartUI();
}
function refreshItem(id) {
  const qty = cart[id]||0;
  const card = document.getElementById("card-"+id);
  if(card){ card.className="item-card"+(qty>0?" in-cart":""); }
  const ctrl = document.getElementById("ctrl-"+id);
  if(ctrl) ctrl.innerHTML = renderCtrl(id,qty);
  const badge = document.getElementById("badge-"+id);
  if(badge){ badge.textContent=qty>0?`${qty} in cart ✓`:""; badge.className="cart-badge"+(qty>0?" show":""); }
}

function updateCartUI() {
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = Object.entries(cart).reduce((s,[id,q])=>{const it=ALL_ITEMS.find(i=>i.id===id);return s+(it?it.price*q:0);},0);
  const cartBtn = document.getElementById("cartBtn");
  const footer = document.getElementById("stickyFooter");
  document.getElementById("cartLabel").textContent = `${count} item${count!==1?"s":""} · ${fmt(total)}`;
  document.getElementById("footerLabel").textContent = `${count} items · ${fmt(total)}`;
  document.getElementById("cartTotal").textContent = fmt(total);
  cartBtn.classList.toggle("visible", count>0);
  footer.classList.toggle("visible", count>0);
}

function openCart() {
  renderCartItems();
  document.getElementById("cartDrawer").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeCart() {
  document.getElementById("cartDrawer").classList.remove("open");
  document.body.style.overflow = "";
}
function closeCartOutside(e) { if(e.target===e.currentTarget) closeCart(); }

function renderCartItems() {
  const wrap = document.getElementById("cartItems");
  wrap.innerHTML = "";
  Object.entries(cart).forEach(([id,qty])=>{
    const it = ALL_ITEMS.find(i=>i.id===id);
    if(!it) return;
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="cart-item-thumb"><img id="cimg-${id}" alt="${it.name}" /></div>
      <div class="cart-item-info">
        <div class="cart-item-name">${it.name}</div>
        <div class="cart-item-unit">${fmt(it.price)} each</div>
      </div>
      <div class="cart-item-right">
        <button class="qty-btn" onclick="remItem('${id}');renderCartItems();updateCartUI()">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="addItem('${id}');renderCartItems();updateCartUI()">+</button>
        <span class="cart-item-total">${fmt(it.price*qty)}</span>
      </div>`;
    const url = getImg(id);
    if(url){ const img=document.getElementById("cimg-"+id); if(img) { img.src=url; img.style.objectPosition=ITEM_POS[id]||"center center"; } }
    wrap.appendChild(div);
  });
}

function placeOrder() {
  if(!tableNumber) return;
  const note = document.getElementById("noteInput").value.trim();
  const id = Math.random().toString(36).slice(2,8).toUpperCase();
  const total = Object.entries(cart).reduce((s,[itemId,q])=>{const it=ALL_ITEMS.find(i=>i.id===itemId);return s+(it?it.price*q:0);},0);
  const order = {
    id, table: tableNumber, note,
    items: Object.entries(cart).map(([itemId,qty])=>{
      const it=ALL_ITEMS.find(i=>i.id===itemId);
      return {id:itemId,name:it.name,qty,price:it.price};
    }),
    total, status:"received", timestamp: Date.now(),
  };
  const existing = JSON.parse(localStorage.getItem("cb_orders")||"[]");
  localStorage.setItem("cb_orders", JSON.stringify([order,...existing]));
  closeCart();
  cart = {}; updateCartUI();
  MENU.forEach(c=>c.items.forEach(it=>refreshItem(it.id)));
  document.getElementById("successOrderId").textContent = `Table ${tableNumber} · Order #${id}`;
  document.getElementById("success-screen").classList.add("show");
}

function resetAndOrder() {
  document.getElementById("success-screen").classList.remove("show");
  document.getElementById("noteInput").value = "";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

// ── READ TABLE FROM URL ──────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const tableNumber = params.get("table");

if (!tableNumber || isNaN(tableNumber) || Number(tableNumber) < 1) {
  // No valid table param — block access
  document.getElementById("no-table-screen").style.display = "flex";
  document.querySelector("header").style.display = "none";
} else {
  // Valid table — show menu, lock table display
  document.getElementById("tableTag").style.display = "flex";
  document.getElementById("tableTag").textContent = "🪑 Table " + tableNumber;
  document.getElementById("tableDisplayNum").textContent = "Table " + tableNumber;
  document.querySelector(".logo-name").textContent = "Table " + tableNumber + " — Menu";

  buildTabs();
  renderItems();
  updateHero();
  updateCartUI();
}
</script>
</body>
</html>
