<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Casa Bianca — Chef Display</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0A0A; --card: #141414; --card2: #1a1a1a;
    --border: #222; --border2: #2a2a2a;
    --text: #E8E8E8; --muted: #555; --dim: #888;
    --orange: #E87040; --green: #4CAF7D; --red: #D94040;
    --blue: #5B9BD5; --amber: #E8A850;
  }
  html { background: var(--bg); }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }

  header {
    background: #111; border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-sub { font-size: 9px; letter-spacing: .2em; color: var(--orange); text-transform: uppercase; }
  .logo-title { font-size: 17px; font-weight: 800; }
  .active-count {
    border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 700;
    border: 1px solid transparent; transition: all .3s;
  }
  .active-count.has-orders { background: rgba(232,112,64,.15); border-color: rgba(232,112,64,.4); color: var(--orange); }
  .active-count.no-orders { background: #1a1a1a; border-color: var(--border); color: var(--muted); }
  .nav-links { display: flex; gap: 8px; }
  .nav-link {
    font-size: 11px; color: var(--muted); text-decoration: none;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 12px; transition: color .2s;
  }
  .nav-link:hover { color: var(--text); }

  /* TICKER */
  .ticker {
    background: #111; border-bottom: 1px solid var(--border);
    padding: 7px 24px; display: flex; gap: 24px; overflow-x: auto; flex-shrink: 0;
  }
  .ticker::-webkit-scrollbar { display: none; }
  .ticker-item { font-size: 11px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .ticker-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ORDER GRID */
  .orders-grid { padding: 16px 16px 72px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px; }

  .order-card {
    background: var(--card); border-radius: 14px; border: 2px solid var(--border);
    overflow: hidden; transition: border-color .4s, box-shadow .4s;
    animation: popIn .3s ease;
  }
  @keyframes popIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none} }
  .order-card.urgent { border-color: var(--red) !important; box-shadow: 0 0 24px rgba(217,64,64,.25); }
  .order-card.warning { border-color: var(--orange) !important; }
  .order-card.preparing-state { border-color: rgba(232,112,64,.4); }

  .card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 14px 10px;
  }
  .table-num { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; }
  .order-id-small { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .timer-block { text-align: right; }
  .timer { font-size: 28px; font-weight: 900; line-height: 1; }
  .timer-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .status-chip {
    margin: 0 14px 10px; display: inline-block; border-radius: 20px;
    padding: 4px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  }

  /* ITEMS */
  .card-items { border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
  .card-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; border-bottom: 1px solid var(--border2);
  }
  .card-item:last-child { border-bottom: none; }
  .card-item-name { font-size: 14px; color: #ddd; }
  .card-item-qty { font-size: 16px; font-weight: 900; color: var(--orange); min-width: 30px; text-align: right; }

  /* NOTE */
  .card-note {
    margin: 10px 14px 0;
    background: rgba(255,255,0,.06); border: 1px solid rgba(255,255,0,.15);
    border-radius: 7px; padding: 7px 10px; font-size: 12px; color: #ffe066;
  }

  /* URGENT BANNER */
  .urgent-banner {
    margin: 8px 14px 0; background: rgba(217,64,64,.15); border: 1px solid rgba(217,64,64,.4);
    border-radius: 7px; padding: 6px 10px; font-size: 11px; color: var(--red); font-weight: 700;
  }

  /* ACTION BUTTON */
  .card-footer { padding: 12px 14px 14px; }
  .action-btn {
    width: 100%; border: none; border-radius: 10px; padding: 13px;
    cursor: pointer; font-weight: 800; font-size: 14px; font-family: inherit;
    color: #fff; transition: opacity .15s, transform .1s;
  }
  .action-btn:hover { opacity: .88; }
  .action-btn:active { transform: scale(.98); }
  .action-btn.start { background: var(--orange); }
  .action-btn.ready { background: var(--green); }

  /* EMPTY STATE */
  .empty {
    grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .empty-icon { font-size: 56px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
  .empty-sub { font-size: 12px; }

  /* PING ALERT */
  .ping-alert {
    position: fixed; top: 80px; right: 20px; z-index: 999;
    background: var(--orange); color: #fff; border-radius: 12px;
    padding: 12px 20px; font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    transform: translateX(120%); transition: transform .3s;
  }
  .ping-alert.show { transform: none; }

  /* FOOTER BAR */
  .stats-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #111; border-top: 1px solid var(--border);
    padding: 8px 24px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
  }
  .stat-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat-item span { font-weight: 700; }

  @media(max-width:500px) {
    .orders-grid { grid-template-columns: 1fr; padding: 10px 10px 72px; }
    header { padding: 10px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <div class="logo-sub">Kitchen Display</div>
      <div class="logo-title">👨‍🍳 Chef Station</div>
    </div>
    <div class="active-count no-orders" id="activeCount">0 Active</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:10px;color:var(--muted)" id="refreshLabel">Auto-refresh on</span>
    <div class="nav-links">
      <a href="menu.html" class="nav-link">🛒 Menu</a>
      <a href="admin.html" class="nav-link">📋 Admin</a>
    </div>
  </div>
</header>

<div class="ticker" id="ticker"></div>
<div class="orders-grid" id="ordersGrid"></div>
<div class="stats-bar" id="statsBar"></div>

<div class="ping-alert" id="pingAlert">🔔 New order in the kitchen!</div>

<script>
const fmt = n=>`₹${Number(n).toLocaleString("en-IN")}`;
const elapsedMin = ts=>Math.floor((Date.now()-ts)/60000);

let prevActive = 0;
let tick = 0;

function getOrders() { return JSON.parse(localStorage.getItem("cb_orders")||"[]"); }
function saveOrders(o) { localStorage.setItem("cb_orders",JSON.stringify(o)); }

function advanceOrder(id, nextStatus) {
  const orders = getOrders().map(o=>o.id===id?{...o,status:nextStatus}:o);
  saveOrders(orders); render();
}

function render() {
  tick++;
  const allOrders = getOrders();
  const active = allOrders.filter(o=>o.status==="received"||o.status==="preparing");
  const served = allOrders.filter(o=>o.status==="served").length;
  const ready = allOrders.filter(o=>o.status==="ready").length;

  // Active count badge
  const countEl = document.getElementById("activeCount");
  countEl.textContent = active.length+" Active";
  countEl.className = "active-count "+(active.length>0?"has-orders":"no-orders");

  // Ticker
  const ticker = document.getElementById("ticker");
  if(allOrders.length===0) {
    ticker.innerHTML = `<div class="ticker-item"><div class="ticker-dot" style="background:#555"></div><span style="color:#555">No orders yet — waiting for customers</span></div>`;
  } else {
    ticker.innerHTML = allOrders.slice(0,8).map(o=>{
      const colors={received:"#5B9BD5",preparing:"#E87040",ready:"#4CAF7D",served:"#555"};
      return `<div class="ticker-item"><div class="ticker-dot" style="background:${colors[o.status]}"></div><span style="color:#aaa">Table ${o.table} · ${o.items.map(i=>i.name).join(", ")}</span></div>`;
    }).join("");
  }

  // Stats bar
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-item">🟠 Preparing: <span>${allOrders.filter(o=>o.status==="preparing").length}</span></div>
    <div class="stat-item">🟢 Ready: <span>${ready}</span></div>
    <div class="stat-item">✅ Served today: <span>${served}</span></div>
    <div class="stat-item">📦 Total orders: <span>${allOrders.length}</span></div>
  `;

  // Alert for new active
  if(active.length > prevActive && prevActive >= 0 && tick > 1) pingAlert();
  prevActive = active.length;

  // Render grid
  const grid = document.getElementById("ordersGrid");
  if(active.length===0) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">👨‍🍳</div>
      <div class="empty-title">All caught up!</div>
      <div class="empty-sub">New orders appear here the moment they're placed from the <a href="menu.html" style="color:#E8A850;text-decoration:none">menu page</a>.</div>
    </div>`;
    return;
  }

  // Keep existing cards, update or add new ones
  const existingIds = new Set([...grid.querySelectorAll(".order-card")].map(c=>c.dataset.id));
  const activeIds = new Set(active.map(o=>o.id));

  // Remove cards no longer active
  existingIds.forEach(id=>{ if(!activeIds.has(id)) { const el=grid.querySelector(`[data-id="${id}"]`); if(el) el.remove(); } });

  active.forEach(order=>{
    const elapsed = elapsedMin(order.timestamp);
    const urgent = elapsed >= 15;
    const warning = elapsed >= 8 && !urgent;
    const isPreparing = order.status==="preparing";
    const statusColor = isPreparing?"#E87040":"#5B9BD5";
    const statusBg = isPreparing?"rgba(232,112,64,.12)":"rgba(91,155,213,.12)";
    const statusLabel = isPreparing?"Preparing":"New Order";
    const timerColor = urgent?"#D94040":warning?"#E87040":"#4CAF7D";

    const html = `
      <div class="card-header">
        <div>
          <div class="table-num">Table ${order.table}</div>
          <div class="order-id-small">#${order.id}</div>
        </div>
        <div class="timer-block">
          <div class="timer" style="color:${timerColor}">${elapsed}m</div>
          <div class="timer-label">waiting</div>
        </div>
      </div>
      <div class="status-chip" style="background:${statusBg};color:${statusColor};border:1px solid ${statusColor}40">${statusLabel}</div>
      <div class="card-items">
        ${order.items.map(it=>`
          <div class="card-item">
            <span class="card-item-name">${it.name}</span>
            <span class="card-item-qty">×${it.qty}</span>
          </div>`).join("")}
      </div>
      ${order.note?`<div class="card-note">⚠ ${order.note}</div>`:""}
      ${urgent?`<div class="urgent-banner">🚨 URGENT — Over 15 minutes! Check on this order.</div>`:""}
      <div class="card-footer">
        ${order.status==="received"
          ?`<button class="action-btn start" onclick="advanceOrder('${order.id}','preparing')">🔥 Start Preparing</button>`
          :`<button class="action-btn ready" onclick="advanceOrder('${order.id}','ready')">✅ Mark Ready — Send to Table</button>`
        }
      </div>`;

    const existing = grid.querySelector(`[data-id="${order.id}"]`);
    if(existing) {
      existing.className = `order-card${urgent?" urgent":warning?" warning":isPreparing?" preparing-state":""}`;
      existing.innerHTML = html;
    } else {
      const card = document.createElement("div");
      card.className = `order-card${urgent?" urgent":warning?" warning":isPreparing?" preparing-state":""}`;
      card.dataset.id = order.id;
      card.innerHTML = html;
      grid.insertBefore(card, grid.firstChild);
    }
  });
}

function pingAlert() {
  const a = document.getElementById("pingAlert");
  a.classList.add("show");
  setTimeout(()=>a.classList.remove("show"), 3000);
  try { new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA").play().catch(()=>{}); } catch(e){}
}

// Poll every 3 seconds for cross-tab updates
render();
setInterval(render, 3000);
window.addEventListener("storage", e=>{ if(e.key==="cb_orders") render(); });
</script>
</body>
</html>
